<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Tahun Baru 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #ff6b6b, #4ecdc4);
            color: white;
            margin: 0;
            padding: 50px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5em;
            margin: 20px 0;
        }
        .fireworks {
            font-size: 2em;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>Selamat Tahun Baru 2026!</h1>
    <p>Semoga tahun ini penuh dengan kebahagiaan, kesehatan, dan kesuksesan.</p>
    <p>Mari sambut masa depan dengan semangat baru! 🎉</p>
    <div class="fireworks">✨✨✨✨✨</div>
</body>
</html>
